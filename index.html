<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diário de Bordo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark" data-palette="tweed">
  <div class="app-wrapper">
    <header class="navbar">
      <div class="brand">
        <span class="symbol">✦</span>
        <span class="brand-title">Diário</span>
      </div>

      <div class="header-controls">
        <div class="palette-picker">
          <button class="dot tweed" onclick="setPalette('tweed')" title="Monocromático"></button>
          <button class="dot champagne" onclick="setPalette('champagne')" title="Champagne"></button>
          <button class="dot olive" onclick="setPalette('olive')" title="Verde Oliva"></button>
          <button class="dot navy" onclick="setPalette('navy')" title="Azul Marinho"></button>
          <button class="dot burgundy" onclick="setPalette('burgundy')" title="Burgundy"></button>
        </div>

        <button id="themeToggleBtn" class="btn-icon" aria-label="Alternar Tema">
          <span class="theme-icon">☼</span>
        </button>
      </div>
    </header>

    <main class="content">
      <section class="editor-section">
        <div class="editor-header">
          <p class="current-date" id="currentDateTitle"></p>
        </div>
        
        <div class="input-group">
          <textarea id="entryText" placeholder="Como foi o seu dia?"></textarea>
        </div>

        <div id="imagePreviewContainer" class="preview-container"></div>

        <div class="editor-footer">
          <div class="file-upload">
            <label for="entryPhoto" class="btn-primary custom-file-btn">
              📷 Anexar Imagem
            </label>
            <input type="file" id="entryPhoto" accept="image/*" />
            <button id="removePhotoBtn" class="btn-link hidden" onclick="removeSelectedPhoto()">Remover imagem</button>
          </div>

          <div class="action-buttons">
            <button id="cancelBtn" class="btn-link hidden" onclick="cancelEdit()">Cancelar</button>
            <button id="saveBtn" class="btn-primary" onclick="saveEntry()">Publicar</button>
          </div>
        </div>
      </section>

      <!-- Calendário de Navegação -->
      <section class="calendar-section">
        <div class="calendar-header">
          <button class="btn-link" onclick="changeMonth(-1)">‹</button>
          <span id="calendarMonthYear" class="calendar-title"></span>
          <button class="btn-link" onclick="changeMonth(1)">›</button>
        </div>
        <div class="calendar-weekdays">
          <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
        </div>
        <div id="calendarDays" class="calendar-days"></div>
        <div id="filterInfo" class="filter-info hidden">
          <span id="filterLabel"></span>
          <button class="btn-link" onclick="clearDateFilter()">Limpar filtro</button>
        </div>
      </section>

      <section class="timeline-section">
        <div class="tabs-navigation">
          <button id="tabActive" class="tab-btn active" onclick="switchTab('active')">
            Memórias Registradas
          </button>
          <button id="tabTrash" class="tab-btn" onclick="switchTab('trash')">
            🗑️ Lixeira (<span id="trashCount">0</span>)
          </button>
        </div>
        
        <div id="entriesList" class="entries-list"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
